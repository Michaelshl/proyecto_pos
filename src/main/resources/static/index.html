<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>POS - Nombre por confirmar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; }

    header {
      background: #1a1a2e; color: white;
      padding: 16px 32px; display: flex;
      justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 20px; }
    #status { font-size: 13px; color: #aef; }

    .container { max-width: 900px; margin: 32px auto; padding: 0 16px; }

    .card {
      background: white; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 24px; margin-bottom: 24px;
    }
    .card h2 { font-size: 16px; margin-bottom: 16px; color: #333; border-bottom: 2px solid #1a1a2e; padding-bottom: 8px; }

    .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .form-row input, .form-row select {
      flex: 1; min-width: 140px; padding: 8px 12px;
      border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    }
    button {
      padding: 9px 20px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 14px; font-weight: bold;
    }
    .btn-primary { background: #1a1a2e; color: white; }
    .btn-danger  { background: #dc3545; color: white; }
    .btn-warning { background: #ffc107; color: #333; }
    button:hover { opacity: 0.85; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #1a1a2e; color: white; padding: 10px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #eee; }
    tr:hover td { background: #f9f9f9; }
    .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge-active   { background: #d4edda; color: #155724; }
    .badge-inactive { background: #f8d7da; color: #721c24; }

    .login-box { max-width: 380px; margin: 80px auto; }
    .login-box input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .login-box button { width: 100%; }
    .btn-salir { background: transparent; color: white; border: 1px solid white; padding: 6px 14px; margin-left: 12px; }
    .msg { padding: 10px 16px; border-radius: 6px; margin-top: 12px; font-size: 14px; display: none; }
    .msg-ok  { background: #d4edda; color: #155724; }
    .msg-err { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

<header>
  <h1>🛒 POS - Nombre por confirmar</h1>
  <span>
    <span id="status"></span>
    <button id="btn-salir" class="btn-salir" style="display:none" onclick="logout()">Cerrar sesión</button>
  </span>
</header>

<!-- VISTA DE LOGIN (RF-001) -->
<div id="vista-login" class="container">
  <div class="card login-box">
    <h2>Iniciar sesión</h2>
    <input id="l-username" placeholder="Usuario" autocomplete="username" />
    <input id="l-password" placeholder="Contraseña" type="password" autocomplete="current-password" />
    <button class="btn-primary" onclick="login()">Entrar</button>
    <div id="msg-login" class="msg"></div>
  </div>
</div>

<!-- VISTA PRINCIPAL: solo visible con sesión iniciada -->
<div id="vista-app" class="container" style="display:none">

  <!-- CREAR USUARIO -->
  <div class="card solo-admin">
    <h2>Crear Usuario</h2>
    <div class="form-row">
      <input id="c-nombre"   placeholder="Nombre" />
      <input id="c-apellido" placeholder="Apellido" />
      <input id="c-username" placeholder="Username" />
    </div>
    <div class="form-row">
      <input id="c-email"    placeholder="Email" type="email" />
      <input id="c-password" placeholder="Contraseña" type="password" />
      <select id="c-rol"><option value="1">ADMIN</option></select>
    </div>
    <button class="btn-primary" onclick="crearUsuario()">Crear Usuario</button>
    <div id="msg-crear" class="msg"></div>
  </div>

  <!-- TABLA DE USUARIOS -->
  <div class="card solo-admin">
    <h2>Usuarios Registrados <button class="btn-primary" style="float:right;font-size:12px" onclick="cargarUsuarios()">↺ Recargar</button></h2>
    <table>
      <thead><tr><th>ID</th><th>Nombre</th><th>Username</th><th>Email</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody id="tabla-usuarios"><tr><td colspan="7" style="text-align:center;color:#999">Cargando...</td></tr></tbody>
    </table>
  </div>

  <!-- ACTUALIZAR USUARIO -->
  <div class="card solo-admin">
    <h2>Actualizar Usuario</h2>
    <div class="form-row">
      <input id="u-id"       placeholder="ID del usuario" type="number" style="max-width:100px" />
      <input id="u-nombre"   placeholder="Nuevo nombre" />
      <input id="u-apellido" placeholder="Nuevo apellido" />
      <input id="u-email"    placeholder="Nuevo email" type="email" />
    </div>
    <button class="btn-warning" onclick="actualizarUsuario()">Actualizar</button>
    <div id="msg-actualizar" class="msg"></div>
  </div>

  <!-- INACTIVAR USUARIO -->
  <div class="card solo-admin">
    <h2>Inactivar Usuario</h2>
    <div class="form-row">
      <input id="i-id"     placeholder="ID del usuario" type="number" style="max-width:100px" />
      <input id="i-motivo" placeholder="Motivo de inactivación" style="flex:3" />
    </div>
    <button class="btn-danger" onclick="inactivarUsuario()">Inactivar</button>
    <div id="msg-inactivar" class="msg"></div>
  </div>

  <!-- BUSCAR USUARIO (RF-006) -->
  <div class="card solo-admin">
    <h2>Buscar Usuario</h2>
    <div class="form-row">
      <input id="b-username" placeholder="Username" />
      <input id="b-email"    placeholder="o Email" type="email" />
    </div>
    <button class="btn-primary" onclick="buscarUsuario()">Buscar</button>
    <div id="msg-buscar" class="msg"></div>
  </div>

  <!-- ASIGNAR ROL (RF-009) -->
  <div class="card solo-admin">
    <h2>Asignar Rol a un Usuario</h2>
    <div class="form-row">
      <input id="a-id" placeholder="ID del usuario" type="number" style="max-width:100px" />
      <select id="a-rol"><option value="1">ADMIN</option></select>
    </div>
    <button class="btn-warning" onclick="asignarRol()">Asignar rol</button>
    <div id="msg-asignar" class="msg"></div>
  </div>

  <!-- CREAR ROL (RF-008) -->
  <div class="card solo-admin">
    <h2>Crear Rol</h2>
    <div class="form-row">
      <input id="r-nombre"   placeholder="Nombre del rol" />
      <input id="r-desc"     placeholder="Descripción" />
      <input id="r-permisos" placeholder="Permisos separados por coma" />
    </div>
    <button class="btn-primary" onclick="crearRol()">Crear Rol</button>
    <div id="msg-rol" class="msg"></div>
  </div>

  <!-- CATEGORÍAS (RF-010 y RF-012) -->
  <div class="card">
    <h2>Categorías <button class="btn-primary" style="float:right;font-size:12px" onclick="cargarCategorias()">↺ Listar</button></h2>
    <div class="solo-admin">
      <div class="form-row">
        <input id="k-nombre" placeholder="Nombre de la categoría" />
        <input id="k-desc"   placeholder="Descripción" />
      </div>
      <button class="btn-primary" onclick="crearCategoria()">Crear Categoría</button>
    </div>
    <div id="msg-categoria" class="msg"></div>
    <table style="margin-top:16px">
      <thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th></tr></thead>
      <tbody id="tabla-categorias"><tr><td colspan="3" style="text-align:center;color:#999">Pulse Listar</td></tr></tbody>
    </table>
  </div>


</div>

<script>
  let token = null;

  async function login() {
    const username = document.getElementById('l-username').value.trim();
    const password = document.getElementById('l-password').value;
    const msg = document.getElementById('msg-login');
    if (!username || !password) {
      mostrar('msg-login', false, 'Ingrese usuario y contraseña');
      return;
    }
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        mostrar('msg-login', false, err.message || 'Login fallido');
        return;
      }
      token = (await res.json()).token;
      msg.style.display = 'none';
      document.getElementById('l-password').value = '';
      const rol = rolDelToken(token);
      document.getElementById('status').textContent = 'Conectado como ' + username + (rol ? ' (' + rol + ')' : '');
      aplicarRol(rol);
      mostrarVista(true);
      if (rol === 'ADMIN') {
        cargarRoles();
        cargarUsuarios();
      }
      cargarCategorias();
    } catch (e) {
      mostrar('msg-login', false, 'No se pudo conectar con el servidor');
    }
  }

  // Solo para decidir qué se muestra: la autorización real la hace el servidor.
  function rolDelToken(t) {
    try {
      const b64 = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(b64)).rol || null;
    } catch (e) {
      return null;
    }
  }

  function aplicarRol(rol) {
    document.querySelectorAll('.solo-admin').forEach(el => {
      el.style.display = rol === 'ADMIN' ? '' : 'none';
    });
  }

  function mostrarVista(conSesion) {
    document.getElementById('vista-login').style.display = conSesion ? 'none' : 'block';
    document.getElementById('vista-app').style.display = conSesion ? 'block' : 'none';
    document.getElementById('btn-salir').style.display = conSesion ? 'inline-block' : 'none';
    if (!conSesion) document.getElementById('status').textContent = '';
  }

  async function cargarRoles() {
    const select = document.getElementById('c-rol');
    try {
      const res = await fetch('/api/roles', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) return;
      const roles = await res.json();
      const opciones = roles.map(r => `<option value="${r.id}">${r.nombre}</option>`).join('');
      select.innerHTML = opciones;
      document.getElementById('a-rol').innerHTML = opciones;
    } catch (e) {
      // se conserva la opción por defecto del select
    }
  }

  async function cargarUsuarios() {
    const tbody = document.getElementById('tabla-usuarios');
    try {
      const res = await fetch('/api/usuarios', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 404) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999">Sin usuarios aún</td></tr>';
        return;
      }
      const usuarios = await res.json();
      if (!Array.isArray(usuarios) || usuarios.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999">Sin usuarios</td></tr>';
        return;
      }
      tbody.innerHTML = usuarios.map(u => `
        <tr>
          <td>${u.id}</td>
          <td>${u.nombre} ${u.apellido}</td>
          <td>${u.username}</td>
          <td>${u.email}</td>
          <td>${u.rol}</td>
          <td><span class="badge ${u.activo ? 'badge-active' : 'badge-inactive'}">${u.activo ? 'Activo' : 'Inactivo'}</span></td>
          <td>
            <button class="btn-warning" style="font-size:12px;padding:4px 10px" onclick="fillActualizar(${u.id},'${u.nombre}','${u.apellido}','${u.email}')">Editar</button>
            <button class="btn-danger"  style="font-size:12px;padding:4px 10px;margin-left:4px" onclick="fillInactivar(${u.id})">Inactivar</button>
          </td>
        </tr>`).join('');
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999">Sin usuarios aún</td></tr>';
    }
  }

  async function crearUsuario() {
    const body = {
      nombre:   document.getElementById('c-nombre').value,
      apellido: document.getElementById('c-apellido').value,
      username: document.getElementById('c-username').value,
      email:    document.getElementById('c-email').value,
      password: document.getElementById('c-password').value,
      rolId:    parseInt(document.getElementById('c-rol').value)
    };
    const res = await fetch('/api/usuarios', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(body)
    });
    const msg = document.getElementById('msg-crear');
    if (res.ok) {
      msg.className = 'msg msg-ok'; msg.style.display = 'block';
      msg.textContent = '✅ Usuario creado correctamente';
      cargarUsuarios();
      ['c-nombre','c-apellido','c-username','c-email','c-password'].forEach(id => document.getElementById(id).value = '');
    } else {
      const err = await res.json();
      msg.className = 'msg msg-err'; msg.style.display = 'block';
      msg.textContent = '❌ ' + (err.message || 'Error al crear usuario');
    }
  }

  async function actualizarUsuario() {
    const id = document.getElementById('u-id').value;
    const body = {
      nombre:   document.getElementById('u-nombre').value,
      apellido: document.getElementById('u-apellido').value,
      email:    document.getElementById('u-email').value
    };
    const res = await fetch(`/api/usuarios/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(body)
    });
    const msg = document.getElementById('msg-actualizar');
    if (res.ok) {
      msg.className = 'msg msg-ok'; msg.style.display = 'block';
      msg.textContent = '✅ Usuario actualizado';
      cargarUsuarios();
    } else {
      msg.className = 'msg msg-err'; msg.style.display = 'block';
      msg.textContent = '❌ Error al actualizar';
    }
  }

  async function inactivarUsuario() {
    const id = document.getElementById('i-id').value;
    const motivo = document.getElementById('i-motivo').value;
    const res = await fetch(`/api/usuarios/${id}/inactivar`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ motivo })
    });
    const msg = document.getElementById('msg-inactivar');
    if (res.ok) {
      msg.className = 'msg msg-ok'; msg.style.display = 'block';
      msg.textContent = '✅ Usuario inactivado';
      cargarUsuarios();
    } else {
      msg.className = 'msg msg-err'; msg.style.display = 'block';
      msg.textContent = '❌ Error al inactivar';
    }
  }

  function fillActualizar(id, nombre, apellido, email) {
    document.getElementById('u-id').value = id;
    document.getElementById('u-nombre').value = nombre;
    document.getElementById('u-apellido').value = apellido;
    document.getElementById('u-email').value = email;
    document.getElementById('msg-actualizar').style.display = 'none';
  }

  function fillInactivar(id) {
    document.getElementById('i-id').value = id;
    document.getElementById('i-motivo').value = '';
    document.getElementById('msg-inactivar').style.display = 'none';
  }

  function mostrar(idMsg, ok, texto) {
    const msg = document.getElementById(idMsg);
    msg.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
    msg.style.display = 'block';
    msg.textContent = (ok ? '✅ ' : '❌ ') + texto;
  }

  function esc(texto) {
    const d = document.createElement('div');
    d.textContent = texto == null ? '' : texto;
    return d.innerHTML;
  }

  async function llamar(metodo, url, cuerpo, tokenUsado = token) {
    const headers = { 'Authorization': 'Bearer ' + tokenUsado };
    if (cuerpo !== undefined) headers['Content-Type'] = 'application/json';
    const res = await fetch(url, {
      method: metodo,
      headers,
      body: cuerpo !== undefined ? JSON.stringify(cuerpo) : undefined
    });
    const texto = await res.text();
    let datos = null;
    try { datos = texto ? JSON.parse(texto) : null; } catch (e) { datos = texto; }
    return { ok: res.ok, status: res.status, datos };
  }

  function detalle(r, porDefecto) {
    return (r.datos && r.datos.message) ? r.datos.message : porDefecto;
  }

  async function buscarUsuario() {
    const username = document.getElementById('b-username').value.trim();
    const email = document.getElementById('b-email').value.trim();
    const param = username ? 'username=' + encodeURIComponent(username)
                           : 'email=' + encodeURIComponent(email);
    const r = await llamar('GET', '/api/usuarios/buscar?' + param);
    if (r.ok) {
      const u = r.datos;
      mostrar('msg-buscar', true, `ID ${u.id} · ${u.nombre} ${u.apellido} · ${u.username} · ${u.email} · ${u.rol} · ${u.activo ? 'Activo' : 'Inactivo'}`);
    } else {
      mostrar('msg-buscar', false, detalle(r, 'Error al buscar'));
    }
  }

  async function asignarRol() {
    const id = document.getElementById('a-id').value;
    const rolId = parseInt(document.getElementById('a-rol').value);
    const r = await llamar('PATCH', `/api/usuarios/${id}/rol`, { rolId });
    if (r.ok) {
      mostrar('msg-asignar', true, `Rol de ${r.datos.username} ahora es ${r.datos.rol}`);
      cargarUsuarios();
    } else {
      mostrar('msg-asignar', false, detalle(r, 'Error al asignar rol'));
    }
  }

  async function crearRol() {
    const permisos = document.getElementById('r-permisos').value
      .split(',').map(p => p.trim()).filter(p => p);
    const r = await llamar('POST', '/api/roles', {
      nombre: document.getElementById('r-nombre').value,
      descripcion: document.getElementById('r-desc').value,
      permisos
    });
    if (r.ok) {
      mostrar('msg-rol', true, `Rol ${r.datos.nombre} creado`);
      ['r-nombre','r-desc','r-permisos'].forEach(id => document.getElementById(id).value = '');
      cargarRoles();
    } else {
      mostrar('msg-rol', false, detalle(r, 'Error al crear rol'));
    }
  }

  async function crearCategoria() {
    const r = await llamar('POST', '/api/categorias', {
      nombre: document.getElementById('k-nombre').value,
      descripcion: document.getElementById('k-desc').value
    });
    if (r.ok) {
      mostrar('msg-categoria', true, `Categoría ${r.datos.nombre} creada`);
      ['k-nombre','k-desc'].forEach(id => document.getElementById(id).value = '');
      cargarCategorias();
    } else {
      mostrar('msg-categoria', false, detalle(r, 'Error al crear categoría'));
    }
  }

  async function cargarCategorias() {
    const tbody = document.getElementById('tabla-categorias');
    const r = await llamar('GET', '/api/categorias');
    if (!r.ok) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999">No se pudo listar</td></tr>';
      mostrar('msg-categoria', false, detalle(r, 'Error al listar categorías'));
      return;
    }
    if (r.datos.categorias.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999">Sin categorías</td></tr>';
      return;
    }
    tbody.innerHTML = r.datos.categorias.map(c =>
      `<tr><td>${c.id}</td><td>${esc(c.nombre)}</td><td>${esc(c.descripcion)}</td></tr>`).join('');
  }

  async function logout() {
    await llamar('POST', '/api/auth/logout');
    token = null;
    mostrarVista(false);
    document.getElementById('msg-login').style.display = 'none';
    document.getElementById('l-username').focus();
  }

  document.getElementById('l-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

</script>
</body>
</html>
