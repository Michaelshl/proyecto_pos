spring.application.name=pos

# Los secretos NO van en este archivo. Se leen de variables de entorno o del archivo local .env
# (ignorado por Git). Ver .env.example. Sin DB_PASSWORD y JWT_SECRET la aplicación no arranca.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pos_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=update: Hibernate agrega columnas nuevas si detecta cambios en las entidades.
# NO elimina columnas. En producción usar "validate" o "none".
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8081

# Clave HMAC de al menos 32 caracteres.
jwt.secret=${JWT_SECRET}

jwt.expiration=86400000
