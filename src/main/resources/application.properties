spring.application.name=pos

# Los secretos NO van en este archivo. Se leen de variables de entorno o del archivo local .env
# (ignorado por Git). Ver .env.example. Sin DB_PASSWORD y JWT_SECRET la aplicación no arranca.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pos_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo crea y cambia Flyway con los scripts de src/main/resources/db/migration
# (V1__..., V2__...). Hibernate solo comprueba que las entidades coincidan con la base.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Las consultas SQL no se imprimen por defecto (llenan el log y pueden mostrar datos).
# Para depurar: variable de entorno SHOW_SQL=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8081

# Clave HMAC de al menos 32 caracteres.
jwt.secret=${JWT_SECRET}

# 2 horas. Corto a propósito: un token robado deja de servir pronto, y el logout lo revoca antes.
jwt.expiration=7200000

# Logs: consola y archivo logs/pos.log (ignorado por Git). El archivo rota al llegar a 10 MB,
# conserva 14 días y no pasa de 100 MB en total. Las acciones sensibles y los eventos de seguridad
# salen con el nombre AUDITORIA (quién, qué y sobre qué). Nunca se registran contraseñas ni tokens.
logging.file.name=logs/pos.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=100MB
logging.level.com.pos=INFO
logging.level.org.hibernate=WARN
